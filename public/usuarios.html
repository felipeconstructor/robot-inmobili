<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(location.hostname.includes('broker'))document.documentElement.classList.add('broker')</script>
<title>Nova — Usuarios</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh}
.header{background:#1A3A5C;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.header h1{color:#fff;font-size:18px;font-weight:500}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav a{color:#C9A96E;font-size:12px;text-decoration:none;padding:5px 12px;border:1px solid rgba(201,169,110,.5);border-radius:20px;transition:all .2s;white-space:nowrap}
.nav a:hover{background:#C9A96E;color:#1A3A5C;border-color:#C9A96E}
.nav a.activo{background:#C9A96E;color:#1A3A5C;border-color:#C9A96E;font-weight:600}
.nav-salir{color:#888 !important;border-color:rgba(136,136,136,.3) !important}
.nav-salir:hover{background:#888 !important;color:#fff !important;border-color:#888 !important}
.container{max-width:900px;margin:0 auto;padding:1.5rem}
.panel{background:#fff;border-radius:12px;border:0.5px solid #e0e0e0;overflow:hidden;margin-bottom:1.5rem}
.panel-header{padding:.875rem 1.25rem;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.panel-header h2{font-size:15px;font-weight:500;color:#1A3A5C}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:12px;font-weight:500;color:#888;background:#fafafa;border-bottom:1px solid #f0f0f0}
td{padding:11px 14px;font-size:13px;color:#333;border-bottom:1px solid #f8f8f8}
tr:hover td{background:#fafcff}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge-admin{background:#EAF3DE;color:#0F6E56}
.badge-agente{background:#E6F1FB;color:#0C447C}
.badge-inactivo{background:#f0f0f0;color:#999}
.btn{padding:5px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:12px;cursor:pointer;color:#333;transition:all .18s}
.btn:hover{background:#f0f0f0}
.btn-primary{background:#1A3A5C;color:#fff;border-color:#1A3A5C}
.btn-primary:hover{background:#0f2540}
.btn-danger{color:#c0392b;border-color:#e0a0a0}
.btn-danger:hover{background:#fcebeb}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1.25rem}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;font-weight:500;color:#555}
.form-group input,.form-group select{padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;color:#333;background:#fafafa;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:#1A3A5C;background:#fff}
.form-footer{padding:.875rem 1.25rem;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1A3A5C;color:#fff;padding:.75rem 1.25rem;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;z-index:200;pointer-events:none}
.toast.activo{opacity:1}
.empty{text-align:center;padding:3rem;color:#aaa;font-size:14px}

/* Modal editar */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:center;justify-content:center}
.overlay.activo{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.75rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.modal h3{font-size:16px;font-weight:600;color:#1A3A5C;margin-bottom:1.25rem}
.modal .form-group{margin-bottom:1rem}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem;padding-top:1rem;border-top:1px solid #f0f0f0}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.panel{animation:fadeUp .35s ease both}
.panel:nth-child(2){animation-delay:.1s}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.overlay.activo .modal{animation:scaleIn .2s cubic-bezier(.34,1.3,.64,1)}

/* Broker theme */
.broker .header{background:#3B52D4}
.broker .form-group input:focus,.broker .form-group select:focus{border-color:#3B52D4}
.broker .btn-primary{background:#3B52D4;border-color:#3B52D4}
.broker .btn-primary:hover{background:#2D40B8}
.broker .panel-header h2{color:#3B52D4}
.broker .modal h3{color:#3B52D4}
.broker tr:hover td{background:#EEF1FB}
</style>
</head>
<body>

<div class="header">
  <h1>Usuarios del sistema</h1>
  <nav class="nav">
    <a href="/admin.html">Propiedades</a>
    <a href="/crm.html">CRM</a>
    <a href="/administraciones.html">Administraciones</a>
    <a href="/finanzas.html">Finanzas</a>
    <a href="/usuarios.html" class="activo">Usuarios</a>
    <a href="/api/logout" class="nav-salir">Salir</a>
  </nav>
</div>

<div class="container">

  <!-- Nuevo usuario -->
  <div class="panel">
    <div class="panel-header">
      <h2>Agregar usuario</h2>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="n-nombre" placeholder="Juan Perez">
      </div>
      <div class="form-group">
        <label>Correo</label>
        <input type="email" id="n-email" placeholder="juan@correo.com">
      </div>
      <div class="form-group">
        <label>Contrasena</label>
        <input type="password" id="n-password" placeholder="Minimo 6 caracteres">
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select id="n-rol">
          <option value="agente">Agente — ve solo sus leads</option>
          <option value="admin">Admin — ve todo el sistema</option>
        </select>
      </div>
    </div>
    <div class="form-footer">
      <button class="btn btn-primary" id="btn-crear" onclick="crearUsuario()">Crear usuario</button>
    </div>
  </div>

  <!-- Lista usuarios -->
  <div class="panel">
    <div class="panel-header">
      <h2>Usuarios activos</h2>
      <span style="font-size:12px;color:#aaa;cursor:pointer" onclick="cargarUsuarios()">Actualizar</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Creado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-usuarios">
        <tr><td colspan="6" class="empty">Cargando...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Modal editar -->
<div class="overlay" id="overlay-editar">
  <div class="modal">
    <h3>Editar usuario</h3>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" id="edit-nombre">
    </div>
    <div class="form-group">
      <label>Rol</label>
      <select id="edit-rol">
        <option value="agente">Agente</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="form-group">
      <label>Nueva contrasena (dejar vacio para no cambiar)</label>
      <input type="password" id="edit-password" placeholder="Nueva contrasena">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar-edit" onclick="guardarEdicion()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
async function cargarUsuarios() {
  try {
    const res = await fetch('/api/usuarios')
    if (!res.ok) { document.getElementById('tabla-usuarios').innerHTML = '<tr><td colspan="6" class="empty" style="color:#c0392b">Error cargando usuarios</td></tr>'; return }
    const data = await res.json()
    if (!data.length) { document.getElementById('tabla-usuarios').innerHTML = '<tr><td colspan="6" class="empty">Sin usuarios aun</td></tr>'; return }
    document.getElementById('tabla-usuarios').innerHTML = data.map(u => `
      <tr>
        <td><strong>${u.nombre}</strong></td>
        <td>${u.email}</td>
        <td><span class="badge badge-${u.rol}">${u.rol}</span></td>
        <td>${u.activo ? '<span style="color:#0F6E56;font-weight:500">Activo</span>' : '<span class="badge badge-inactivo">Inactivo</span>'}</td>
        <td style="color:#888">${new Date(u.created_at).toLocaleDateString('es-CL')}</td>
        <td>
          <div style="display:flex;gap:6px">
            <button class="btn" onclick="abrirEditar('${u.id}','${u.nombre.replace(/'/g,"\\'")}','${u.rol}')">Editar</button>
            <button class="btn btn-danger" onclick="toggleActivo('${u.id}',${u.activo},'${u.nombre.replace(/'/g,"\\'")}')">
              ${u.activo ? 'Desactivar' : 'Activar'}
            </button>
          </div>
        </td>
      </tr>`).join('')
  } catch(e) {
    document.getElementById('tabla-usuarios').innerHTML = '<tr><td colspan="6" class="empty" style="color:#c0392b">Error: ' + e.message + '</td></tr>'
  }
}

async function crearUsuario() {
  const nombre = document.getElementById('n-nombre').value.trim()
  const email = document.getElementById('n-email').value.trim()
  const password = document.getElementById('n-password').value
  const rol = document.getElementById('n-rol').value
  if (!nombre || !email || !password) { toast('Completa todos los campos'); return }
  if (password.length < 6) { toast('La contrasena debe tener al menos 6 caracteres'); return }
  const btn = document.getElementById('btn-crear')
  btn.disabled = true; btn.textContent = 'Creando...'
  try {
    const res = await fetch('/api/usuarios', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, email, password, rol })
    })
    const data = await res.json()
    if (!res.ok) { toast('Error: ' + (data.error || 'No se pudo crear')); return }
    toast('Usuario creado')
    document.getElementById('n-nombre').value = ''
    document.getElementById('n-email').value = ''
    document.getElementById('n-password').value = ''
    document.getElementById('n-rol').value = 'agente'
    cargarUsuarios()
  } catch(e) {
    toast('Error: ' + e.message)
  } finally {
    btn.disabled = false; btn.textContent = 'Crear usuario'
  }
}

function abrirEditar(id, nombre, rol) {
  document.getElementById('edit-id').value = id
  document.getElementById('edit-nombre').value = nombre
  document.getElementById('edit-rol').value = rol
  document.getElementById('edit-password').value = ''
  document.getElementById('overlay-editar').classList.add('activo')
}

function cerrarModal() {
  document.getElementById('overlay-editar').classList.remove('activo')
}

async function guardarEdicion() {
  const id = document.getElementById('edit-id').value
  const nombre = document.getElementById('edit-nombre').value.trim()
  const rol = document.getElementById('edit-rol').value
  const password = document.getElementById('edit-password').value
  if (!nombre) { toast('El nombre no puede estar vacio'); return }
  const btn = document.getElementById('btn-guardar-edit')
  btn.disabled = true; btn.textContent = 'Guardando...'
  try {
    const body = { nombre, rol }
    if (password) body.password = password
    const res = await fetch('/api/usuarios/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    const data = await res.json()
    if (!res.ok) { toast('Error: ' + (data.error || 'No se pudo guardar')); return }
    toast('Guardado')
    cerrarModal()
    cargarUsuarios()
  } catch(e) {
    toast('Error: ' + e.message)
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar'
  }
}

async function toggleActivo(id, activo, nombre) {
  const accion = activo ? 'desactivar' : 'activar'
  if (!confirm(`${accion.charAt(0).toUpperCase() + accion.slice(1)} a ${nombre}?`)) return
  try {
    await fetch('/api/usuarios/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ activo: !activo })
    })
    toast('Usuario ' + (activo ? 'desactivado' : 'activado'))
    cargarUsuarios()
  } catch(e) {
    toast('Error: ' + e.message)
  }
}

function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = 'toast activo'
  setTimeout(() => t.className = 'toast', 3000)
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal() })

fetch('/api/config').then(r => r.json()).then(cfg => {
  if (cfg.siteName && cfg.siteName.toLowerCase().includes('broker')) document.documentElement.classList.add('broker')
}).catch(() => {})

cargarUsuarios()
</script>
</body>
</html>
