<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/nova-premium.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(location.hostname.includes('broker'))document.documentElement.classList.add('broker')</script>
<title>Nova — Acceso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#fff;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08);border:0.5px solid #e0e0e0}
.logo{text-align:center;margin-bottom:2rem}
.logo-mark{width:52px;height:52px;background:#1A3A5C;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.logo-mark svg{width:28px;height:28px;fill:none;stroke:#C9A96E;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo h1{font-size:22px;font-weight:600;color:#1A3A5C}
.logo p{font-size:13px;color:#999;margin-top:4px}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-size:12px;font-weight:500;color:#555;margin-bottom:6px}
.form-group input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;color:#333;background:#fafafa;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#1A3A5C;background:#fff}
.btn-login{width:100%;padding:12px;background:#1A3A5C;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.btn-login:hover{background:#0f2540}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.error{font-size:13px;color:#c0392b;text-align:center;margin-top:.875rem;min-height:20px}
.footer{text-align:center;margin-top:1.75rem;font-size:12px;color:#bbb}
.input-wrap{position:relative}
.input-wrap input{width:100%;padding:11px 40px 11px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;color:#333;background:#fafafa;outline:none;transition:border-color .2s}
.input-wrap input:focus{border-color:#1A3A5C;background:#fff}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:13px;padding:0}

/* ── Broker Inmobiliaria theme ───────────────────────────────────── */
.broker .logo-mark{background:#3B52D4}
.broker .logo-mark .icon-default{display:none}
.broker .logo-mark .icon-broker{display:block !important}
.broker .logo h1{color:#3B52D4}
.broker .form-group input:focus{border-color:#3B52D4}
.broker .input-wrap input:focus{border-color:#3B52D4}
.broker .btn-login{background:#3B52D4}
.broker .btn-login:hover{background:#2D40B8}
.broker .broker-slogan{display:block !important}
.broker .login-subtitle-default{display:none}

/* ── Animacion entrada card ──────────────────────────────────────── */
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.card{animation:cardIn .4s cubic-bezier(.34,1.1,.64,1)}
.btn-login{transition:background .2s,transform .1s,box-shadow .2s}
.btn-login:active{transform:scale(.98)}
.form-group input,.input-wrap input{transition:border-color .2s,box-shadow .2s}
.form-group input:focus,.input-wrap input:focus{box-shadow:0 0 0 3px rgba(26,58,92,.08)}
.broker .form-group input:focus,.broker .input-wrap input:focus{box-shadow:0 0 0 3px rgba(59,82,212,.12)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <!-- Prolig -->
      <svg class="icon-default" viewBox="0 0 24 24" style="width:28px;height:28px;fill:none;stroke:#C9A96E;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <!-- Broker -->
      <svg class="icon-broker" viewBox="0 0 36 30" style="display:none;width:30px;height:26px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round"><polyline points="2,17 11,10 11,18"/><line x1="2" y1="17" x2="2" y2="25"/><line x1="2" y1="25" x2="11" y2="25"/><polyline points="11,17 20,8 29,17"/><polyline points="11,17 11,27 29,27 29,17"/><line x1="20" y1="27" x2="20" y2="29"/></svg>
    </div>
    <h1 id="site-name">Nova</h1>
    <p class="login-subtitle-default">Panel de administracion</p>
    <p class="broker-slogan" style="display:none;font-size:11px;color:#3B52D4;letter-spacing:2px;font-weight:500;text-transform:uppercase;margin-top:2px">Un Pacto de Confianza</p>
  </div>

  <div class="form-group">
    <label>Correo</label>
    <input type="email" id="email" placeholder="usuario@correo.com" onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
  </div>

  <div class="form-group">
    <label>Contrasena</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="Ingresa tu contrasena" onkeydown="if(event.key==='Enter')login()">
      <button class="toggle-pw" type="button" onclick="togglePw(this)" tabindex="-1">Ver</button>
    </div>
  </div>

  <button class="btn-login" id="btn" onclick="login()">Ingresar</button>
  <div class="error" id="error"></div>

  <div class="footer" id="site-footer">Prolig Propiedades &mdash; Sistema Nova</div>
</div>

<script>
fetch('/api/config').then(r=>r.json()).then(cfg=>{
  if(cfg.siteName){
    document.getElementById('site-name').textContent=cfg.siteName
    document.getElementById('site-footer').textContent=cfg.siteName+' — Sistema Nova'
    document.title=cfg.siteName+' — Acceso'
    if(cfg.siteName.toLowerCase().includes('broker')){
      document.documentElement.classList.add('broker')
    }
  }
}).catch(()=>{})

function togglePw(btn) {
  const input = document.getElementById('password')
  const show = input.type === 'password'
  input.type = show ? 'text' : 'password'
  btn.textContent = show ? 'Ocultar' : 'Ver'
}
async function login() {
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn = document.getElementById('btn')
  const errorEl = document.getElementById('error')
  if (!password) { errorEl.textContent = 'Ingresa tu contrasena'; return }
  btn.disabled = true
  btn.textContent = 'Verificando...'
  errorEl.textContent = ''
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })
    const data = await res.json()
    if (res.ok) {
      const params = new URLSearchParams(location.search)
      const next = params.get('next')
      const destino = next || (data.rol === 'agente' ? '/crm.html' : '/admin.html')
      location.href = destino
    } else {
      errorEl.textContent = data.error || 'Credenciales incorrectas'
      btn.disabled = false
      btn.textContent = 'Ingresar'
    }
  } catch {
    errorEl.textContent = 'Error de conexion, intenta de nuevo'
    btn.disabled = false
    btn.textContent = 'Ingresar'
  }
}
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js")</script>
</body>
</html>
