<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/nova-premium.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(location.hostname.includes('broker'))document.documentElement.classList.add('broker')</script>
<title>Nueva contrasena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#fff;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08);border:0.5px solid #e0e0e0}
.logo{text-align:center;margin-bottom:2rem}
.logo-mark{width:52px;height:52px;background:#1A3A5C;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.logo-mark svg{width:28px;height:28px;fill:none;stroke:#C9A96E;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo h1{font-size:20px;font-weight:600;color:#1A3A5C}
.logo p{font-size:13px;color:#999;margin-top:4px}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-size:12px;font-weight:500;color:#555;margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap input{width:100%;padding:11px 40px 11px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;color:#333;background:#fafafa;outline:none;transition:border-color .2s}
.input-wrap input:focus{border-color:#1A3A5C;background:#fff}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:13px;padding:0}
.btn{width:100%;padding:12px;background:#1A3A5C;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.btn:hover{background:#0f2540}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:13px;text-align:center;margin-top:.875rem;min-height:20px}
.msg.ok{color:#16a34a}
.msg.err{color:#c0392b}
.back{text-align:center;margin-top:1.25rem;font-size:13px}
.back a{color:#888;text-decoration:none}
.back a:hover{color:#1A3A5C}
#invalid{text-align:center;padding:1rem 0}
#invalid p{font-size:14px;color:#c0392b;margin-bottom:1rem}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.card{animation:cardIn .4s cubic-bezier(.34,1.1,.64,1)}
/* Broker theme */
.broker .logo-mark{background:#3B52D4}
.broker .logo-mark svg{stroke:#fff}
.broker .logo h1{color:#3B52D4}
.broker .input-wrap input:focus{border-color:#3B52D4}
.broker .btn{background:#3B52D4}
.broker .btn:hover{background:#2D40B8}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Nueva contrasena</h1>
    <p id="card-subtitle">Ingresa tu nueva contrasena</p>
  </div>

  <div id="invalid" style="display:none">
    <p>El enlace es invalido o ha expirado.</p>
    <a href="/forgot-password.html" style="font-size:13px;color:#1A3A5C">Solicitar nuevo enlace</a>
  </div>

  <div id="formulario">
    <div class="form-group">
      <label>Nueva contrasena</label>
      <div class="input-wrap">
        <input type="password" id="pw1" placeholder="Minimo 8 caracteres" onkeydown="if(event.key==='Enter')document.getElementById('pw2').focus()">
        <button class="toggle-pw" type="button" onclick="togglePw('pw1',this)" tabindex="-1">Ver</button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirmar contrasena</label>
      <div class="input-wrap">
        <input type="password" id="pw2" placeholder="Repite la contrasena" onkeydown="if(event.key==='Enter')guardar()">
        <button class="toggle-pw" type="button" onclick="togglePw('pw2',this)" tabindex="-1">Ver</button>
      </div>
    </div>
    <button class="btn" id="btn" onclick="guardar()">Guardar contrasena</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="back"><a href="/login.html">Volver al inicio de sesion</a></div>
</div>

<script>
fetch('/api/config').then(r=>r.json()).then(cfg=>{
  if(cfg.siteName&&cfg.siteName.toLowerCase().includes('broker'))
    document.documentElement.classList.add('broker')
}).catch(()=>{})

const params = new URLSearchParams(location.search)
const TOKEN = params.get('token')
if (!TOKEN) {
  document.getElementById('formulario').style.display = 'none'
  document.getElementById('invalid').style.display = ''
  document.getElementById('card-subtitle').textContent = 'Enlace invalido'
}

function togglePw(id, btn) {
  const input = document.getElementById(id)
  const show = input.type === 'password'
  input.type = show ? 'text' : 'password'
  btn.textContent = show ? 'Ocultar' : 'Ver'
}

async function guardar() {
  const pw1 = document.getElementById('pw1').value
  const pw2 = document.getElementById('pw2').value
  const btn = document.getElementById('btn')
  const msg = document.getElementById('msg')
  msg.textContent = ''

  if (!pw1 || pw1.length < 8) {
    msg.className = 'msg err'
    msg.textContent = 'La contrasena debe tener al menos 8 caracteres'
    return
  }
  if (pw1 !== pw2) {
    msg.className = 'msg err'
    msg.textContent = 'Las contrasenas no coinciden'
    return
  }

  btn.disabled = true
  btn.textContent = 'Guardando...'

  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, newPassword: pw1 })
    })
    const data = await res.json()
    if (res.ok) {
      msg.className = 'msg ok'
      msg.textContent = 'Contrasena actualizada. Redirigiendo...'
      btn.textContent = 'Listo'
      setTimeout(() => location.href = '/login.html', 2000)
    } else {
      msg.className = 'msg err'
      msg.textContent = data.error || 'Error al actualizar la contrasena'
      if (data.error && (data.error.includes('invalido') || data.error.includes('expirado'))) {
        document.getElementById('formulario').style.display = 'none'
        document.getElementById('invalid').style.display = ''
      }
      btn.disabled = false
      btn.textContent = 'Guardar contrasena'
    }
  } catch {
    msg.className = 'msg err'
    msg.textContent = 'Error de conexion, intenta de nuevo'
    btn.disabled = false
    btn.textContent = 'Guardar contrasena'
  }
}
</script>
</body>
</html>
