<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/nova-premium.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(location.hostname.includes('broker'))document.documentElement.classList.add('broker')</script>
<title>Nueva contrasena</title>
<style>
body{display:flex;align-items:center;justify-content:center;padding:1rem;min-height:100vh}
.card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:var(--shadow-elevated);animation:luxuryIn .5s var(--ease-spring) both}
.logo{text-align:center;margin-bottom:2rem}
.logo-mark{width:52px;height:52px;background:var(--nova);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;border:1px solid rgba(201,169,110,.2)}
.logo-mark svg{width:28px;height:28px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo h1{font-size:20px;font-weight:600;color:var(--text-1)}
.logo p{font-size:13px;color:var(--text-3);margin-top:4px}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap input{width:100%;padding:11px 40px 11px 14px}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);font-size:13px;padding:0}
.toggle-pw:hover{color:var(--gold)}
.btn{width:100%;padding:12px;background:var(--nova);color:var(--text-1);border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);letter-spacing:.03em}
.btn:hover{background:var(--nova-light);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{font-size:13px;text-align:center;margin-top:.875rem;min-height:20px}
.msg.ok{color:#6EE7B7}
.msg.err{color:#FCA5A5}
.back{text-align:center;margin-top:1.25rem;font-size:13px}
.back a{color:var(--text-3);text-decoration:none}
.back a:hover{color:var(--gold)}
#invalid{text-align:center;padding:1rem 0}
#invalid p{font-size:14px;color:#FCA5A5;margin-bottom:1rem}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Nueva contrasena</h1>
    <p id="card-subtitle">Ingresa tu nueva contrasena</p>
  </div>

  <div id="invalid" style="display:none">
    <p>El enlace es invalido o ha expirado.</p>
    <a href="/forgot-password.html" style="font-size:13px;color:#1A3A5C">Solicitar nuevo enlace</a>
  </div>

  <div id="formulario">
    <div class="form-group">
      <label>Nueva contrasena</label>
      <div class="input-wrap">
        <input type="password" id="pw1" placeholder="Minimo 8 caracteres" onkeydown="if(event.key==='Enter')document.getElementById('pw2').focus()">
        <button class="toggle-pw" type="button" onclick="togglePw('pw1',this)" tabindex="-1">Ver</button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirmar contrasena</label>
      <div class="input-wrap">
        <input type="password" id="pw2" placeholder="Repite la contrasena" onkeydown="if(event.key==='Enter')guardar()">
        <button class="toggle-pw" type="button" onclick="togglePw('pw2',this)" tabindex="-1">Ver</button>
      </div>
    </div>
    <button class="btn" id="btn" onclick="guardar()">Guardar contrasena</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="back"><a href="/login.html">Volver al inicio de sesion</a></div>
</div>

<script>
fetch('/api/config').then(r=>r.json()).then(cfg=>{
  if(cfg.siteName&&cfg.siteName.toLowerCase().includes('broker'))
    document.documentElement.classList.add('broker')
}).catch(()=>{})

const params = new URLSearchParams(location.search)
const TOKEN = params.get('token')
if (!TOKEN) {
  document.getElementById('formulario').style.display = 'none'
  document.getElementById('invalid').style.display = ''
  document.getElementById('card-subtitle').textContent = 'Enlace invalido'
}

function togglePw(id, btn) {
  const input = document.getElementById(id)
  const show = input.type === 'password'
  input.type = show ? 'text' : 'password'
  btn.textContent = show ? 'Ocultar' : 'Ver'
}

async function guardar() {
  const pw1 = document.getElementById('pw1').value
  const pw2 = document.getElementById('pw2').value
  const btn = document.getElementById('btn')
  const msg = document.getElementById('msg')
  msg.textContent = ''

  if (!pw1 || pw1.length < 8) {
    msg.className = 'msg err'
    msg.textContent = 'La contrasena debe tener al menos 8 caracteres'
    return
  }
  if (pw1 !== pw2) {
    msg.className = 'msg err'
    msg.textContent = 'Las contrasenas no coinciden'
    return
  }

  btn.disabled = true
  btn.textContent = 'Guardando...'

  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, newPassword: pw1 })
    })
    const data = await res.json()
    if (res.ok) {
      msg.className = 'msg ok'
      msg.textContent = 'Contrasena actualizada. Redirigiendo...'
      btn.textContent = 'Listo'
      setTimeout(() => location.href = '/login.html', 2000)
    } else {
      msg.className = 'msg err'
      msg.textContent = data.error || 'Error al actualizar la contrasena'
      if (data.error && (data.error.includes('invalido') || data.error.includes('expirado'))) {
        document.getElementById('formulario').style.display = 'none'
        document.getElementById('invalid').style.display = ''
      }
      btn.disabled = false
      btn.textContent = 'Guardar contrasena'
    }
  } catch {
    msg.className = 'msg err'
    msg.textContent = 'Error de conexion, intenta de nuevo'
    btn.disabled = false
    btn.textContent = 'Guardar contrasena'
  }
}
</script>
</body>
</html>
